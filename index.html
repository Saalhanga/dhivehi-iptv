<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhivehi IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: white; font-family: sans-serif; }
    header { background: #111; padding: 15px 20px; font-size: 1.2em; font-weight: bold; }
    .container { display: flex; height: calc(100vh - 50px); }
    .sidebar { width: 220px; background: #111; overflow-y: auto; }
    .channel { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #222; }
    .channel:hover, .channel.active { background: #1a6cff; }
    .channel img { width: 30px; vertical-align: middle; margin-right: 8px; }
    .player { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>📺 Dhivehi IPTV</header>
  <div class="container">
    <div class="sidebar" id="channelList"></div>
    <div class="player">
      <video id="video" controls autoplay></video>
    </div>
  </div>

  <script>
    const channels = [
      {
        name: "Dhaaris TV",
        logo: "https://8upload.com/image/67da2402561e8/15-dhaaristv.png",
        url: "https://1a-1791.com/live/4gf18j5s/live-hls/ptqd-rzhj/chunklist_1080p_i1_DVR.m3u8"
      },
      {
        name: "MMTV",
        logo: "",
        url: "https://sendlive.online/hls/mmtv.m3u8"
      },
      // Add more channels here
    ];

    const list = document.getElementById('channelList');
    const video = document.getElementById('video');
    let hls = null;

    function playChannel(url, el) {
      document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      if (hls) hls.destroy();
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        video.play();
      }
    }

    channels.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'channel';
      div.innerHTML = `<img src="${ch.logo}" onerror="this.style.display='none'"> ${ch.name}`;
      div.onclick = () => playChannel(ch.url, div);
      list.appendChild(div);
    });

    // Auto-play first channel
    if (channels.length > 0) {
      playChannel(channels[0].url, list.firstChild);
    }
  </script>
</body>
</html>
